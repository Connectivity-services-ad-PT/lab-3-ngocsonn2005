openapi: 3.1.0

info:
  title: IoT Ingestion Service API
  version: 1.0.0
  description: Lab 03 contract

servers:
  - url: http://localhost:4010

tags:
  - name: health
  - name: sensor
  - name: telemetry

# ❌ QUAN TRỌNG: BỎ GLOBAL SECURITY
# security: []

paths:

  /health:
    get:
      tags: [health]
      summary: Health check
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              example:
                status: ok

  /sensor-reading:
    post:
      tags: [sensor]
      summary: Create sensor reading

      # ❌ QUAN TRỌNG: bỏ auth ở đây để mock không chặn
      security: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SensorReading"
            example:
              deviceId: SENSOR-001
              sensorType: temperature
              value: 36.5
              unit: celsius
              timestamp: "2026-05-19T10:00:00Z"

      responses:
        "201":
          description: Created
          content:
            application/json:
              example:
                id: reading-001

        "400":
          description: Bad request
          content:
            application/json:
              example:
                status: 400
                detail: Invalid request

        "422":
          description: Validation error
          content:
            application/json:
              example:
                status: 422
                detail: Invalid payload

  /telemetry:
    post:
      tags: [telemetry]
      summary: Create telemetry

      security: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Telemetry"
            example:
              deviceId: SENSOR-001
              metric: humidity
              value: 70
              timestamp: "2026-05-19T10:00:00Z"

      responses:
        "201":
          description: Created
          content:
            application/json:
              example:
                status: ok

components:

  schemas:

    SensorReading:
      type: object
      required: [deviceId, sensorType, value, unit, timestamp]
      properties:
        deviceId:
          type: string
        sensorType:
          type: string
          enum: [temperature, humidity, motion, smoke]
        value:
          type: number
        unit:
          type: string
          enum: [celsius, percent, boolean, ppm]
        timestamp:
          type: string
          format: date-time

    Telemetry:
      type: object
      required: [deviceId, metric, value, timestamp]
      properties:
        deviceId:
          type: string
        metric:
          type: string
          enum: [temperature, humidity, motion, smoke]
        value:
          type: number
        timestamp:
          type: string
          format: date-time

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT